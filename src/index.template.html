<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{URL}}og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Updates" href="{{URL}}feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23C8412B'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%23F4F1EA' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151517" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F1EA;--paper-2:#EBE6DA;--paper-3:#E2DCCD;
  --ink:#17171A;--ink-2:#45454B;--mute:#85817A;--num:#A69E8D;--rule:#D6CFC0;--rule-2:#C4BCAA;
  --accent:#C8412B;--accent-ink:#9A2F1E;--accent-soft:#F3DDD6;
  --ok:#2E6B4E;--ok-soft:#DCEBE0;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --max:1120px;--gut:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151517;--paper-2:#1C1C1F;--paper-3:#242428;
  --ink:#ECE8DF;--ink-2:#BDB8AD;--mute:#8A867E;--num:#A8A399;--rule:#2C2C31;--rule-2:#3D3D44;
  --accent:#E2573F;--accent-ink:#F0846F;--accent-soft:#3A1E19;
  --ok:#7FC49E;--ok-soft:#1B2E24;
}}
:root[data-theme="dark"]{
  --paper:#151517;--paper-2:#1C1C1F;--paper-3:#242428;
  --ink:#ECE8DF;--ink-2:#BDB8AD;--mute:#8A867E;--num:#A8A399;--rule:#2C2C31;--rule-2:#3D3D44;
  --accent:#E2573F;--accent-ink:#F0846F;--accent-soft:#3A1E19;
  --ok:#7FC49E;--ok-soft:#1B2E24;
}
html[lang="zh-Hant"]{--serif:"Noto Serif TC","Fraunces",Georgia,serif;--sans:"Noto Sans TC","Inter",-apple-system,"PingFang TC","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);font-feature-settings:"ss01","cv11";overflow-x:hidden}
a{color:inherit}
::selection{background:var(--accent);color:var(--paper)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
@media (max-width:640px){:root{--gut:16px}}
b,strong{font-weight:600}
button{font-family:inherit}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
html[lang="zh-Hant"] .mono,html[lang="zh-Hant"] .tag,html[lang="zh-Hant"] .lb,html[lang="zh-Hant"] .chip,html[lang="zh-Hant"] summary,html[lang="zh-Hant"] .strip .l,html[lang="zh-Hant"] .hero-meta,html[lang="zh-Hant"] .xall{letter-spacing:.02em;text-transform:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#F4F1EA;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:19px;display:grid;place-items:center;line-height:1}
.brand .nm{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:-.01em}
nav.main{display:flex;gap:2px;margin-left:auto}
nav.main a{text-decoration:none;font-size:13.5px;color:var(--ink-2);padding:6px 10px;border-radius:6px;position:relative;white-space:nowrap}
nav.main a:hover{background:var(--paper-2);color:var(--ink)}
nav.main a.on{color:var(--ink)}
nav.main a.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
@media (max-width:900px){nav.main{display:none}}
.srch{position:relative;flex-shrink:0}
.srch input{width:140px;padding:7px 10px 7px 30px;border:1px solid var(--rule-2);border-radius:8px;background:var(--paper-2);color:var(--ink);font:13px var(--sans);transition:width .2s}
.srch input:focus{outline:2px solid var(--accent);outline-offset:1px;width:210px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--mute);fill:none;stroke-width:2}
.srch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--mute);border:1px solid var(--rule-2);border-radius:4px;padding:0 5px;background:var(--paper)}
.srch input:focus + svg + kbd{display:none}
@media (max-width:640px){.srch input{width:110px}.srch kbd{display:none}}
.lang{flex-shrink:0;border:1px solid var(--rule-2);background:var(--paper-2);color:var(--ink);border-radius:8px;padding:6px 10px;font:12.5px var(--mono);cursor:pointer;white-space:nowrap}
.lang:hover{border-color:var(--accent);color:var(--accent)}
.chip{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule-2);border-radius:999px;padding:4px 10px;white-space:nowrap;flex-shrink:0}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px var(--ok-soft)}
@media (max-width:1000px){.chip{display:none}}
.mnav{display:none;margin-left:auto}
@media (max-width:900px){.mnav{display:block}}
.mnav select{font:13px var(--sans);color:var(--ink);background:var(--paper-2);border:1px solid var(--rule-2);border-radius:8px;padding:7px 8px;max-width:110px}

/* ---------- search results banner ---------- */
.hitbar{display:none;position:sticky;top:60px;z-index:19;background:var(--accent);color:#F4F1EA;font:13px var(--sans);padding:8px 0}
.hitbar.show{display:block}
.hitbar .wrap{display:flex;gap:14px;align-items:center}
.hitbar b{font-family:var(--mono)}
.hitbar button{margin-left:auto;background:transparent;border:1px solid rgba(244,241,234,.6);color:#F4F1EA;border-radius:6px;padding:3px 10px;font:12px var(--sans);cursor:pointer}
body.searching .nohit{display:none!important}

/* ---------- hero ---------- */
.hero{padding:64px 0 40px;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:center}
@media (max-width:900px){.hero{padding:40px 0 28px}.hero .wrap{grid-template-columns:1fr;gap:32px}}
.who{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--paper);box-shadow:0 0 0 1.5px var(--rule-2),0 8px 20px rgba(0,0,0,.08);flex-shrink:0;background:var(--paper-2)}
.who .nm{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.who .tt{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-top:6px}
html[lang="zh-Hant"] .who .tt{letter-spacing:.06em;text-transform:none}
h1.h{font-family:var(--serif);font-weight:400;font-variation-settings:"opsz" 144,"SOFT" 30;font-size:clamp(34px,5.2vw,60px);line-height:1.04;letter-spacing:-.022em;margin:0 0 22px;text-wrap:balance}
html[lang="zh-Hant"] h1.h{font-weight:500;line-height:1.22;letter-spacing:0;font-size:clamp(30px,4.4vw,50px)}
h1.h em{font-style:italic;font-weight:500;color:var(--accent)}
html[lang="zh-Hant"] h1.h em{font-style:normal}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);max-width:560px;margin:0 0 26px}
@media (max-width:640px){.lede{font-size:16.5px}}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-family:var(--mono);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.hero-meta b{color:var(--ink);font-weight:500}

/* scorecard */
.score{background:var(--paper-2);border:1px solid var(--rule);border-radius:14px;padding:24px 26px 20px;position:relative;overflow:hidden}
.score::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--rule) 1px,transparent 1px) 0 0/100% 28px;opacity:.35;pointer-events:none;mask-image:linear-gradient(#000 60%,transparent);-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.score>*{position:relative}
.score .hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.score .stamp{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:3px 7px;transform:rotate(-4deg);transform-origin:right top}
html[lang="zh-Hant"] .score .stamp{text-transform:none;letter-spacing:.08em}
.bigwrap{display:flex;align-items:baseline;gap:8px;margin:4px 0 16px}
.big{font-family:"Fraunces",Georgia,serif;font-variation-settings:"opsz" 144,"SOFT" 50;font-weight:300;font-size:92px;line-height:.9;letter-spacing:-.04em;color:var(--ink)}
.bigwrap small{font-family:var(--mono);font-size:13px;color:var(--mute)}
.dim{display:grid;grid-template-columns:140px 1fr 40px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:13.5px;position:relative}
.dim:last-of-type{border-bottom:1px solid var(--rule)}
.dim .nm{color:var(--ink-2);cursor:help;text-decoration:underline dotted var(--rule-2);text-underline-offset:3px}
.dim .bar{height:6px;background:var(--paper-3);border-radius:3px;overflow:hidden}
.dim .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:3px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.dim.low .bar i{background:var(--accent)}
.dim .v{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.dim.low .v{color:var(--accent);font-weight:500}
.dim .tip{display:none;position:absolute;left:0;top:100%;z-index:3;background:var(--ink);color:var(--paper);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.dim:hover .tip,.dim:focus-within .tip{display:block}
.score .cap{font-size:12px;color:var(--mute);margin:12px 0 0}
@media (max-width:420px){.dim{grid-template-columns:110px 1fr 36px;gap:8px}.big{font-size:76px}}

/* stats strip */
.strip{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin-top:44px}
.strip .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.strip .st{padding:18px 18px 18px 0;border-right:1px solid var(--rule)}
.strip .st:last-child{border-right:0}
.strip .st+.st{padding-left:18px}
.strip .n{font-family:"Fraunces",Georgia,serif;font-variation-settings:"opsz" 96;font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1}
.strip .l{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-top:6px}
@media (max-width:720px){.strip .wrap{grid-template-columns:1fr 1fr}.strip .st{border-right:0;border-bottom:1px solid var(--rule)}.strip .st:nth-child(odd){border-right:1px solid var(--rule)}.strip .st:nth-child(n+3){border-bottom:0}.strip .st+.st{padding-left:18px}.strip .st:nth-child(3){padding-left:0}}

/* ---------- sections ---------- */
section.sec{padding:64px 0 8px;scroll-margin-top:70px}
@media (max-width:640px){section.sec{padding:46px 0 4px}}
.sh{display:grid;grid-template-columns:96px 1fr auto;gap:20px;align-items:end;padding-bottom:16px;border-bottom:1px solid var(--ink);margin-bottom:22px}
.sh .num{font-family:"Fraunces",Georgia,serif;font-variation-settings:"opsz" 144;font-weight:300;font-size:58px;line-height:.8;color:var(--accent);letter-spacing:-.03em}
.sh h2{font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 96;font-size:clamp(26px,3.2vw,36px);letter-spacing:-.02em;line-height:1.1;margin:0;display:flex;align-items:center;gap:12px}
.sh h2 svg.i{width:26px;height:26px;color:var(--accent);stroke-width:1.5}
.sh p{margin:6px 0 0;color:var(--mute);font-size:14px;max-width:640px}
.xall{background:none;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;padding:5px 12px;font:11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap;margin-bottom:4px}
.xall:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){.sh{grid-template-columns:1fr auto;gap:8px}.sh .num{display:none}}

/* verdict */
.verdict{display:grid;grid-template-columns:96px 1fr;gap:20px}
.verdict .side{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;line-height:1.6;padding-top:6px}
.verdict .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.verdict .cols p{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.verdict .cols p b{display:block;font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:22px;line-height:1.2;letter-spacing:-.01em;color:var(--ink);margin-bottom:8px}
.verdict .cols p:nth-child(3) b{color:var(--accent)}
@media (max-width:900px){.verdict{grid-template-columns:1fr}.verdict .side{display:none}.verdict .cols{grid-template-columns:1fr;gap:22px}}

/* accordion (shared) */
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.7,.2,1)}
.acc-b>div{overflow:hidden;min-height:0}
.open>.acc-b{grid-template-rows:1fr}
.chev{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s;flex-shrink:0;margin-left:auto}
.open .chev{transform:rotate(180deg)}

/* workflows */
.wf{border-bottom:1px solid var(--rule)}
.wf:first-child{border-top:1px solid var(--rule)}
.wf-h{width:100%;display:grid;grid-template-columns:96px 24px 1fr auto 18px;gap:16px;align-items:center;padding:16px 0;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.wf-h:hover .nm h3{color:var(--accent)}
.wf-h .no{font-family:"Fraunces",Georgia,serif;font-variation-settings:"opsz" 144;font-weight:300;font-size:36px;line-height:1;color:var(--num);letter-spacing:-.03em}
.wf-h svg.i{color:var(--accent)}
.wf-h .nm{min-width:0}
.wf-h h3{font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:20px;letter-spacing:-.01em;margin:0;display:inline;transition:color .15s}
.wf-h .gist{display:block;font-size:13.5px;color:var(--mute);margin-top:3px}
.wf.open .wf-h .gist{display:none}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--ok-soft);color:var(--ok);font-weight:500;white-space:nowrap}
.tag.new{background:var(--accent-soft);color:var(--accent-ink)}
.wf-body{padding:2px 0 22px 136px}
.flow{display:grid;grid-template-columns:1fr 1fr 1fr}
.flow .cell{padding:12px 14px;border:1px solid var(--rule);background:var(--paper-2);position:relative;font-size:14px;line-height:1.5}
.flow .cell+.cell{border-left:0}
.flow .cell:first-child{border-radius:8px 0 0 8px}
.flow .cell:last-child{border-radius:0 8px 8px 0}
.flow .cell .lb{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.flow .cell.ai{background:var(--paper);border-top:2px solid var(--accent)}
.flow .cell.ai .lb{color:var(--accent)}
.flow .cell.out{background:var(--paper-3)}
.flow .cell+.cell::before{content:"";position:absolute;left:-7px;top:50%;width:12px;height:12px;background:inherit;border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:translateY(-50%) rotate(-135deg);z-index:1}
.flow .cell.ai::before{background:var(--paper)}
.flow .cell.out::before{background:var(--paper-3)}
.wf .dep{margin:12px 0 0;font-size:14px;color:var(--ink-2);line-height:1.55}
.wf .dep b{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);font-weight:500;margin-right:8px}
@media (max-width:760px){.wf-h{grid-template-columns:24px 1fr 18px;gap:12px;padding:14px 0}.wf-h .no{display:none}.wf-h .tag{grid-column:2;justify-self:start;margin-top:-2px}.wf-body{padding-left:0}.flow{grid-template-columns:1fr}.flow .cell+.cell{border-left:1px solid var(--rule);border-top:0}.flow .cell:first-child{border-radius:8px 8px 0 0}.flow .cell:last-child{border-radius:0 0 8px 8px}.flow .cell.ai{border-top:1px solid var(--rule);border-left:2px solid var(--accent)}.flow .cell+.cell::before{left:50%;top:-7px;transform:translateX(-50%) rotate(-45deg)}}

/* cards (knowledge + outputs) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper-2);border:1px solid var(--rule);border-radius:12px;transition:border-color .15s}
.card:hover{border-color:var(--rule-2)}
.card.open{border-color:var(--rule-2)}
.card-h{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;font:inherit}
.card-h svg.i{color:var(--accent)}
.card-h h3{font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:18px;line-height:1.25;letter-spacing:-.01em;margin:0;flex:1;min-width:0;min-height:2.5em;display:flex;align-items:center}
.card-h .k{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.04em;white-space:nowrap}
.card-body{padding:0 16px 14px}
.card .it{padding:7px 0;border-top:1px solid var(--rule);font-size:14px;line-height:1.5}
.card .it b{font-weight:600}
.card .it span{color:var(--mute)}
.card .it .mt{font-family:var(--mono);font-size:11px;color:var(--accent);margin-right:8px;letter-spacing:.03em}
.card.found{grid-column:1/-1;background:var(--paper);border:1.5px solid var(--accent)}
.card.found .card-h h3{color:var(--accent)}
.card.found .note{padding:0 16px 14px;font-size:14.5px;color:var(--ink-2);margin:0;max-width:760px}
.card.found .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0 28px}
@media (max-width:760px){.card.found .cols{grid-template-columns:1fr}}
details{border-top:1px solid var(--rule);margin-top:4px}
summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:9px 0 4px;user-select:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font-size:14px;color:var(--accent);width:12px;display:inline-block}
details[open] summary::before{content:"–"}
summary:hover{color:var(--ink)}
details .it{font-size:13.5px;color:var(--ink-2)}
details .also{padding:6px 0 4px;font-size:13.5px;color:var(--ink-2);line-height:1.5}

/* routines */
.routines{display:grid;grid-template-columns:96px 1fr;gap:20px;margin-bottom:40px}
.routines .side{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding-top:12px}
.rt{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:11px 0;border-top:1px solid var(--rule);font-size:14.5px}
.rt.last{border-bottom:1px solid var(--rule)}
.rt .w{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:500;letter-spacing:.02em;padding-top:2px}
.rt.core .w::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:2px}
.rt.x .w{color:var(--mute);font-weight:400}
.rt .d{color:var(--ink-2)}
.routines details{border-top:0;margin:0}
.routines summary{padding:9px 0}
@media (max-width:760px){.routines{grid-template-columns:1fr;gap:6px}.rt{grid-template-columns:1fr;gap:2px}}
.sub-h{font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:22px;margin:0 0 14px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sub-h .mono{font-size:11.5px;text-transform:none;letter-spacing:0}
.sub-h .xall{margin-left:auto}

/* updates */
.upd{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:18px 0;border-top:1px solid var(--rule)}
.upd:last-child{border-bottom:1px solid var(--rule)}
.upd .dt{font-family:var(--mono);font-size:12.5px;color:var(--accent);padding-top:3px}
.upd h4{font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:19px;margin:0 0 4px}
.upd p{margin:0;color:var(--ink-2);font-size:14.5px}
.rss{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule-2);border-radius:999px;padding:6px 12px}
.rss:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){.upd{grid-template-columns:1fr;gap:4px}}

/* about */
.about{display:grid;grid-template-columns:96px 1fr 1fr;gap:20px 40px}
.about .side{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding-top:6px}
.about p{margin:0 0 14px;font-size:15.5px;line-height:1.62;color:var(--ink-2)}
.about .pr{border-top:1px solid var(--rule);padding:14px 0;display:grid;grid-template-columns:24px 1fr;gap:12px}
.about .pr:last-child{border-bottom:1px solid var(--rule)}
.about .pr svg.i{color:var(--accent);margin-top:3px}
.about .pr b{display:block;font-family:var(--serif);font-weight:500;font-variation-settings:"opsz" 48;font-size:18px;color:var(--ink);margin-bottom:4px}
.about .pr span{font-size:14px;color:var(--ink-2)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.links a{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;border:1px solid var(--rule-2);border-radius:999px;padding:6px 12px;color:var(--ink-2)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.links a.ic{padding:7px;border-radius:50%;display:inline-grid;place-items:center}
.links a.ic svg.i{width:16px;height:16px}
@media (max-width:900px){.about{grid-template-columns:1fr}.about .side{display:none}}

/* footer */
footer{margin-top:72px;border-top:1px solid var(--ink);padding:26px 0 44px;font-size:13px;color:var(--mute)}
footer .wrap{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
footer p{margin:0;max-width:640px;line-height:1.55}
footer .r{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:right;line-height:1.9}
html[lang="zh-Hant"] footer .r{text-transform:none}
footer .r b{color:var(--ink);font-weight:500}
footer button{background:none;border:1px solid var(--rule-2);color:var(--ink-2);border-radius:999px;padding:4px 10px;font:11.5px var(--mono);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
footer button:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){footer .wrap{grid-template-columns:1fr}footer .r{text-align:left}}

/* reveal */
.rv{opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
</style>
</head>

      return '<article class="wf f rv"><button class="wf-h acc-h" aria-expanded="false"><span class="no">'+no+'</span>'+ico(w.icon)+'<span class="nm"><h3>'+esc(w.name)+'</h3><span class="gist">'+esc(w.gist)+'</span></span><span class="tag'+(w.status==='new'?' new':'')+'">'+(w.status==='new'?T.newt:T.stable)+'</span>'+CHEV+'</button>'+
        '<div class="acc-b"><div><div class="wf-body"><div class="flow"><div class="cell"><span class="lb">'+T.give+'</span>'+esc(w.input)+'</div><div class="cell ai"><span class="lb">'+T.does+'</span>'+esc(w.ai)+'</div><div class="cell out"><span class="lb">'+T.get+'</span>'+esc(w.output)+'</div></div>'+
        '<p class="dep"><b>'+esc(w.built_label)+'</b>'+esc(w.built)+'</p></div></div></div></article>';
    }).join('');

    /* knowledge */
    $('knowledge-grid').innerHTML = S.knowledge.map(function(k){
      var items = k.items.map(function(i){ return '<div class="it f"><b>'+esc(i[0])+'</b>'+(i[1]?' <span>— '+esc(i[1])+'</span>':'')+'</div>'; });
      if (k.foundation){
        var per=Math.ceil(items.length/3), cols=[items.slice(0,per),items.slice(per,per*2),items.slice(per*2)];
        return '<div class="card found rv"><button class="card-h acc-h" aria-expanded="false">'+ico(k.icon)+'<h3>'+esc(k.name)+'</h3><span class="k">'+k.items.length+'</span>'+CHEV+'</button><p class="note">'+esc(k.note)+'</p><div class="acc-b"><div><div class="card-body"><div class="cols">'+cols.map(function(c){ return '<div>'+c.join('')+'</div>'; }).join('')+'</div></div></div></div></div>';
      }
      var more = k.more ? '<details><summary>'+T.also+'</summary><div class="also f">'+esc(k.more)+'</div></details>' : '';
      return '<div class="card rv"><button class="card-h acc-h" aria-expanded="false">'+ico(k.icon)+'<h3>'+esc(k.name)+'</h3><span class="k">'+k.items.length+'</span>'+CHEV+'</button><div class="acc-b"><div><div class="card-body">'+items.join('')+more+'</div></div></div></div>';
    }).join('');

    /* routines */
    $('r-intro').textContent = S.routines_intro; $('core-legend').textContent = T.coreLegend;
    var core = S.routines.filter(function(r){ return r.core; }), rest = S.routines.filter(function(r){ return !r.core; });
    var row = function(r,i,arr,x){ return '<div class="rt f'+(r.core?' core':'')+(x&&i===arr.length-1?' x':'')+(i===arr.length-1?' last':'')+'"><div class="w">'+esc(r.when)+'</div><div class="d">'+esc(r.what)+'</div></div>'; };
    $('routines').innerHTML = core.map(function(r,i){ return row(r,i,core,false); }).join('') + (rest.length?'<details><summary>'+rest.length+' '+T.more+'</summary>'+rest.map(function(r,i){ return row(r,i,rest,true); }).join('')+'</details>':'');

    /* outputs */
    $('s4-a').textContent = T.s4a; $('s4-b').textContent = T.s4b; $('o-intro').textContent = S.outputs_intro;
    $('outputs-grid').innerHTML = S.outputs.map(function(o,idx){
      var total = o.items.length+(o.more?o.more.length:0);
      var items = o.items.map(function(i){ return '<div class="it f"><span class="mt">'+esc(i[0])+'</span><b>'+esc(i[1])+'</b></div>'; }).join('');
      var more = o.more&&o.more.length ? '<details><summary>'+o.more.length+' '+T.more+'</summary>'+o.more.map(function(m){ return '<div class="it f">'+esc(m)+'</div>'; }).join('')+'</details>' : '';
      return '<div class="card rv"><button class="card-h acc-h" aria-expanded="false">'+ico(OUT_ICONS[idx%OUT_ICONS.length])+'<h3>'+esc(o.name)+'</h3><span class="k">'+total+'</span>'+CHEV+'</button><div class="acc-b"><div><div class="card-body">'+items+more+'</div></div></div></div>';
    }).join('');

    /* updates */
    $('updates-list').innerHTML = S.updates.slice().sort(function(a,b){ return a.date<b.date?1:-1; }).map(function(u){ return '<div class="upd f"><div class="dt">'+esc(u.date)+'</div><div><h4>'+esc(u.title)+'</h4><p>'+esc(u.note)+'</p></div></div>'; }).join('');
    $('rss-l').textContent = T.rss;

    /* about + footer */
    $('a-side').textContent = T.whoWhy; $('a-who').textContent = S.about.who; $('a-why').textContent = S.about.why_site;
    $('a-links').innerHTML = (S.about.links||[]).map(function(l){ return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+' ↗</a>'; }).join('') + (S.about.email_b64 ? '<a class="ic" id="mailto" href="#" title="'+T.email+'" aria-label="'+T.email+'">'+ico('mail')+'</a>' : '');
    if (S.about.email_b64){ $('mailto').addEventListener('click',function(e){ e.preventDefault(); location.href='mailto:'+atob(S.about.email_b64); }); }
    $('principles').innerHTML = S.principles.map(function(p,i){ return '<div class="pr f">'+ico(PR_ICONS[i%3])+'<div><b>'+esc(p.k)+'</b><span>'+esc(p.v)+'</span></div></div>'; }).join('');
    $('f-name').textContent = S.meta.name; $('f-year').textContent = S.meta.data_date.slice(0,4); $('f-disc').textContent = S.footer.disclaimer; $('f-built').textContent = T.built;
    $('theme').textContent = T.theme[themeIdx];

    wire();
  }

  /* ---- behaviours that must re-bind after render ---- */
  var revealed = false;
  function wire(){
    // accordion
    document.querySelectorAll('.acc-h').forEach(function(h){ h.addEventListener('click',function(){ var c=h.parentNode; c.classList.toggle('open'); h.setAttribute('aria-expanded', c.classList.contains('open')); }); });
    document.querySelectorAll('.xall').forEach(function(b){ b.onclick=function(){ var open=b.dataset.state!=='open'; document.querySelectorAll('#'+b.dataset.for+' .acc-h').forEach(function(h){ h.parentNode.classList.toggle('open',open); h.setAttribute('aria-expanded',open); }); b.dataset.state=open?'open':'closed'; b.textContent=open?UI[lang].collapse:UI[lang].expand; }; });
    // reveal + bars
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(!e.isIntersecting) return; var el=e.target; io.unobserve(el);
      if (el.id==='big'){ var t=ALL[lang].score.overall, s=performance.now(); (function tick(n){ var p=Math.min(1,(n-s)/900); el.textContent=(t*(1-Math.pow(1-p,3))).toFixed(1); if(p<1) requestAnimationFrame(tick); })(s); document.querySelectorAll('.dim .bar i').forEach(function(b){ b.style.width=b.getAttribute('data-w')+'%'; }); }
      else el.classList.add('in'); }); },{threshold:.08});
    if (!revealed){ io.observe($('big')); revealed=true; } else { $('big').textContent=ALL[lang].score.overall.toFixed(1); document.querySelectorAll('.dim .bar i').forEach(function(b){ b.style.transition='none'; b.style.width=b.getAttribute('data-w')+'%'; }); }
    document.querySelectorAll('.rv').forEach(function(el){ io.observe(el); });
    // filter re-run if active
    if ($('q').value) filter();
  }

  /* ---- filter ---- */
  function filter(){
    var q=$('q'), v=q.value.trim().toLowerCase(), n=0;
    document.body.classList.toggle('searching',!!v);
    document.querySelectorAll('.f').forEach(function(el){ var hit=!v||el.textContent.toLowerCase().indexOf(v)>-1; el.classList.toggle('nohit',!hit); if(v&&hit) n++; });
    document.querySelectorAll('.card').forEach(function(c){ var any=!v||c.querySelectorAll('.f:not(.nohit)').length>0; c.classList.toggle('nohit',!any); if(v&&any&&!c.classList.contains('open')){ c.classList.add('open','auto'); } if(!v&&c.classList.contains('auto')){ c.classList.remove('open','auto'); } });
    document.querySelectorAll('.wf').forEach(function(w){ if(v&&!w.classList.contains('nohit')&&!w.classList.contains('open')){ w.classList.add('open','auto'); } if(!v&&w.classList.contains('auto')){ w.classList.remove('open','auto'); } });
    document.querySelectorAll('details').forEach(function(d){ d.open=!!v&&d.querySelectorAll('.f:not(.nohit)').length>0; });
    $('hitbar').classList.toggle('show',!!v); $('hitn').textContent=n; $('hitq').textContent=q.value.trim();
  }
  $('q').addEventListener('input',filter);
  $('hitx').addEventListener('click',function(){ $('q').value=''; filter(); });
  document.addEventListener('keydown',function(e){ var q=$('q'); if(e.key==='/'&&document.activeElement!==q&&!/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); } if(e.key==='Escape'&&document.activeElement===q){ q.value=''; filter(); q.blur(); } });

  /* ---- scroll spy / mobile nav ---- */
  var links = Array.prototype.slice.call(document.querySelectorAll('nav.main a'));
  var spy = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ links.forEach(function(a){ a.classList.toggle('on', a.getAttribute('href')==='#'+e.target.id); }); } }); },{rootMargin:'-40% 0px -55% 0px'});
  links.forEach(function(a){ spy.observe(document.querySelector(a.getAttribute('href'))); });
  $('mnav').addEventListener('change',function(){ if(this.value){ location.hash=this.value; this.value=''; } });

  /* ---- theme ---- */
  var order=['auto','light','dark'], cur='auto';
  try{ cur=localStorage.getItem('theme')||'auto'; }catch(e){}
  function applyTheme(){ themeIdx=order.indexOf(cur); if(cur==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',cur); $('theme').textContent=UI[lang].theme[themeIdx]; try{ localStorage.setItem('theme',cur); }catch(e){} }
  $('theme').addEventListener('click',function(){ cur=order[(order.indexOf(cur)+1)%3]; applyTheme(); });

  /* ---- language ---- */
  $('lang').addEventListener('click',function(){ lang = lang==='en'?'zh':'en'; try{ localStorage.setItem('lang',lang); }catch(e){} render(); });

  applyTheme(); render();
})();
</script>
</body>
</html>
