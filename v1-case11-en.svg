<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f3ed"/><g font-family="Arial, PingFang TC, sans-serif" fill="#25342f"><text x="56" y="67" font-size="29" font-weight="700">Different working styles, different strengths and blind spots</text><text x="56" y="105" font-size="19" fill="#72796e">Six fictional roles · Illustrative comparison</text><rect x="40" y="137" width="1200" height="48" rx="8" fill="#e0e7dd"/><text x="56" y="168" font-size="17" font-weight="700">ROLE</text><text x="196" y="168" font-size="17" font-weight="700">WORKING HABIT</text><text x="456" y="168" font-size="17" font-weight="700">STYLE</text><text x="716" y="168" font-size="17" font-weight="700">STRENGTH</text><text x="986" y="168" font-size="17" font-weight="700">IMPROVEMENT</text><rect x="40" y="195" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="235" font-size="17" >Role A</text><text x="196" y="235" font-size="17" >Sets goals before acting</text><text x="456" y="235" font-size="17" >Direct, outcome-focused</text><text x="716" y="235" font-size="17" >Moves decisions forward</text><text x="986" y="235" font-size="17" >Hear different views</text><rect x="40" y="270" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="310" font-size="17" >Role B</text><text x="196" y="310" font-size="17" >Checks evidence first</text><text x="456" y="310" font-size="17" >Careful, evidence-led</text><text x="716" y="310" font-size="17" >Spots hidden problems</text><text x="986" y="310" font-size="17" >Avoid overanalyzing</text><rect x="40" y="345" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="385" font-size="17" >Role C</text><text x="196" y="385" font-size="17" >Tests while building</text><text x="456" y="385" font-size="17" >Flexible, experimental</text><text x="716" y="385" font-size="17" >Tests ideas quickly</text><text x="986" y="385" font-size="17" >Capture lessons learned</text><rect x="40" y="420" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="460" font-size="17" >Role D</text><text x="196" y="460" font-size="17" >Understands each viewpoint</text><text x="456" y="460" font-size="17" >Patient, collaborative</text><text x="716" y="460" font-size="17" >Builds shared understanding</text><text x="986" y="460" font-size="17" >State a clearer position</text><rect x="40" y="495" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="535" font-size="17" >Role E</text><text x="196" y="535" font-size="17" >Works through a checklist</text><text x="456" y="535" font-size="17" >Consistent, detail-oriented</text><text x="716" y="535" font-size="17" >Delivers reliably</text><text x="986" y="535" font-size="17" >Leave room to adapt</text><rect x="40" y="570" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="610" font-size="17" >Role F</text><text x="196" y="610" font-size="17" >Explores possibilities</text><text x="456" y="610" font-size="17" >Open, imaginative</text><text x="716" y="610" font-size="17" >Finds new directions</text><text x="986" y="610" font-size="17" >Turn ideas into action</text><text x="56" y="686" font-size="19" fill="#72796e">Examine habits and tradeoffs. Turn useful feedback into requirements for the next task.</text></g></svg>