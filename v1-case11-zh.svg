<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#f5f3ed"/><g font-family="Arial, PingFang TC, sans-serif" fill="#25342f"><text x="56" y="67" font-size="34" font-weight="700">不同工作方式，帶來不同優勢與盲點</text><text x="56" y="105" font-size="19" fill="#72796e">六位虛構角色 · 示意比較</text><rect x="40" y="137" width="1200" height="48" rx="8" fill="#e0e7dd"/><text x="56" y="168" font-size="17" font-weight="700">角色</text><text x="196" y="168" font-size="17" font-weight="700">工作習慣</text><text x="456" y="168" font-size="17" font-weight="700">協作風格</text><text x="716" y="168" font-size="17" font-weight="700">優勢</text><text x="986" y="168" font-size="17" font-weight="700">改進方向</text><rect x="40" y="195" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="235" font-size="20" >角色 A</text><text x="196" y="235" font-size="20" >先定目標再行動</text><text x="456" y="235" font-size="20" >直接、重結果</text><text x="716" y="235" font-size="20" >能快速推動決定</text><text x="986" y="235" font-size="20" >多聽不同意見</text><rect x="40" y="270" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="310" font-size="20" >角色 B</text><text x="196" y="310" font-size="20" >先查證再下結論</text><text x="456" y="310" font-size="20" >審慎、重依據</text><text x="716" y="310" font-size="20" >能發現隱藏問題</text><text x="986" y="310" font-size="20" >避免分析過久</text><rect x="40" y="345" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="385" font-size="20" >角色 C</text><text x="196" y="385" font-size="20" >邊做邊驗證</text><text x="456" y="385" font-size="20" >靈活、願意嘗試</text><text x="716" y="385" font-size="20" >能快速驗證想法</text><text x="986" y="385" font-size="20" >及時整理經驗</text><rect x="40" y="420" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="460" font-size="20" >角色 D</text><text x="196" y="460" font-size="20" >先理解各方需求</text><text x="456" y="460" font-size="20" >耐心、善於協調</text><text x="716" y="460" font-size="20" >能促成共同理解</text><text x="986" y="460" font-size="20" >更明確表達立場</text><rect x="40" y="495" width="1200" height="67" rx="8" fill="#ffffff"/><text x="56" y="535" font-size="20" >角色 E</text><text x="196" y="535" font-size="20" >按清單逐項完成</text><text x="456" y="535" font-size="20" >穩定、重細節</text><text x="716" y="535" font-size="20" >交付可靠、少遺漏</text><text x="986" y="535" font-size="20" >留出調整空間</text><rect x="40" y="570" width="1200" height="67" rx="8" fill="#ebece5"/><text x="56" y="610" font-size="20" >角色 F</text><text x="196" y="610" font-size="20" >先探索多種可能</text><text x="456" y="610" font-size="20" >開放、善於聯想</text><text x="716" y="610" font-size="20" >能提出新的方向</text><text x="986" y="610" font-size="20" >把想法收斂成行動</text><text x="56" y="686" font-size="19" fill="#72796e">從行為看優勢與代價，把改善方向變成下一次工作的要求。</text></g></svg>