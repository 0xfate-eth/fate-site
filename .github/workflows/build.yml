name: build site
on:
  push:
    branches: [main]
    paths:
      - 'site-data.json'
      - 'site-contact.json'
      - 'site-build.py'
      - 'site-source.css'
      - 'site.js'
      - 'build.py'
      - 'avatar.jpg'
      - 'v4-*.jpg'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build bilingual pages
        run: |
          if [ -f site-build.py ]; then python3 -B build.py; fi
      - name: Commit generated pages
        if: ${{ hashFiles('site-build.py') != '' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'build: regenerate site'
          file_pattern: '*.html styles.css feed.xml sitemap.xml robots.txt'
